<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Impresos y Publicidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: cercano, dulce y alegre, como la marca; claro y ordenado en el panel
   IDEA: satín rosado del logo + un pliego de imprenta con marcas de corte
   PICTURE: tarjetas holográficas apiladas sobre el pliego, con el logo como sticker
   COLOUR/TYPE: rosado satín #ffd1e3, gris carbón #333, rosa fuerte para acciones; la letra de la marca solo en el logo, todo lo demás en Montserrat
   LAYOUT: catálogo con categorías arriba, configurador en ventana, seguimiento y panel interno aparte */
:root{color-scheme:light;
--c1:#d6457f;--c1d:#b8336a;--c2:#f3a6c6;--c3:#fff0f5;--satin:#ffd1e3;
--bg:#fff5f9;--soft:#ffe3ee;--ink:#2b2629;--mut:#6e5a64;--line:#f5cfdf;--card:#fff;
--ok:#d6457f;--warn:#b8336a;--warnbg:#ffe8f1;--bad:#b8336a}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Montserrat,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.brand{font-family:Montserrat,system-ui,sans-serif;font-weight:800;letter-spacing:-.01em}.brand{font-weight:700}
h1,h2,h3{line-height:1.08;margin:0 0 .4em;text-wrap:balance}
h1{font-size:clamp(32px,5vw,48px)}h2{font-size:clamp(24px,3vw,32px)}h3{font-size:19px}
.band{padding:clamp(28px,4vw,56px) max(5vw,16px)}.wrap{max-width:1240px;margin:0 auto}
button,input,select,textarea{font:inherit;font-size:16px;color:inherit}
.btn{min-height:44px;padding:10px 18px;border-radius:999px;border:2px solid var(--c1);background:var(--c1);color:#fff;font-weight:600;cursor:pointer;transition:background .15s}.btn:hover{background:var(--c1d);border-color:var(--c1d)}
.btn.alt{background:#fff;color:var(--c1d);border-color:var(--c2)}.btn.alt:hover{background:var(--soft);border-color:var(--c1)}.btn.pri{background:var(--c1);border-color:var(--c1);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible,a:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.muted{color:var(--mut)}.small{font-size:14px}.price{white-space:nowrap;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:20;background:#ffe3ee;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px max(5vw,16px);max-width:1340px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-size:23px;text-decoration:none;color:var(--ink);margin-right:auto}
.logo img{width:44px;height:44px;border-radius:50%;border:1px solid var(--line)}
nav a{color:var(--ink);text-decoration:none;font-weight:600;padding:8px 10px;border-radius:10px;white-space:nowrap}nav a[aria-current]{background:var(--soft)}
.cartbtn{position:relative}.cartbtn b{position:absolute;top:-6px;right:-6px;background:#fff;color:var(--c1d)!important;border:2px solid var(--c1);color:#fff;border-radius:99px;font-size:12px;min-width:20px;height:20px;display:grid;place-items:center}
.hero{background:radial-gradient(120% 80% at 10% 0%,#fff3f8 0,transparent 55%),radial-gradient(90% 70% at 90% 100%,#ffc3da 0,transparent 60%),linear-gradient(160deg,#ffe0ec,#ffd1e3 50%,#ffe7f0);color:#333033}
:root[data-theme=dark] .hero{color:#333033}
.heroin{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;align-items:center}
.hero p{font-size:17px;max-width:50ch;color:#5a4e55}
.hero .btn{border-color:var(--c1);background:var(--c1);color:#fff}
.fig{position:relative;min-height:330px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
@keyframes floaty{50%{transform:translateY(-8px)}}.flo{animation:floaty 5s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.flo{animation:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.prod .art{background:linear-gradient(160deg,#ffe6ef,#ffd6e6);height:150px;display:grid;place-items:center}
.prod .bd{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}.prod .bd .btn{margin-top:auto}
.lams{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.lamtag{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:1px solid rgba(51,48,51,.15);border-radius:99px;font-size:14px;background:rgba(255,255,255,.7);color:#333033}
.sw{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);flex:none}
.ov{position:fixed;inset:0;background:rgba(30,15,22,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.dlg{background:var(--bg);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px}
@media(min-width:700px){.ov{align-items:center;padding:20px}.dlg{border-radius:22px}}
.dlghead{display:flex;justify-content:space-between;align-items:start;gap:10px}
.x{background:var(--soft);border:0;border-radius:50%;font-size:26px;line-height:1;cursor:pointer;min-width:44px;min-height:44px;color:var(--c1d)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:500}
.chip[aria-pressed=true]{border-color:var(--c1);box-shadow:inset 0 0 0 1px var(--c1);background:color-mix(in srgb,var(--c1) 9%,var(--card))}
.notice{border-radius:14px;padding:14px;margin:14px 0;background:var(--warnbg);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.notice strong{color:var(--warn)}
.okmsg{border-radius:14px;padding:10px 14px;margin:14px 0;background:var(--soft);border:1px solid var(--line);font-size:14px}
.choice{display:grid;gap:8px;margin-top:10px}.choice .chip{justify-content:space-between;text-align:left;width:100%}
.toggle{display:flex;gap:12px;align-items:center;padding:14px;border:1.5px dashed var(--c2);border-radius:14px;margin-top:14px;cursor:pointer}
.toggle input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--c1)}
.total{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:700;margin:18px 0 10px}
.line{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.track{max-width:680px}
.steps{list-style:none;padding:0;margin:20px 0}
.steps li{position:relative;padding:0 0 22px 40px;color:var(--mut)}
.steps li::before{content:"";position:absolute;left:8px;top:4px;width:16px;height:16px;border-radius:50%;border:3px solid var(--line);background:var(--bg)}
.steps li::after{content:"";position:absolute;left:15px;top:24px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps li.done{color:var(--ink)}.steps li.done::before{background:var(--c1);border-color:var(--c1)}
.steps li.now{font-weight:700}.steps li.now::before{box-shadow:0 0 0 5px color-mix(in srgb,var(--c1) 25%,transparent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.tabs .chip[aria-pressed=true]{background:var(--c1);color:#fff;border-color:var(--c1);box-shadow:none}
.tabs .chip b{background:var(--c1d);color:#fff;border-radius:99px;font-size:12px;padding:1px 7px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:13px;color:var(--mut);font-weight:600}
td.r,th.r{text-align:right}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--soft);white-space:nowrap}
.pill{color:var(--c1d)}.pill.recibido{background:#ffd1e3}.pill.listo,.pill.entregado,.pill.bien{background:#fde7f0}
.pill.cancelado,.pill.ya{background:var(--c1);color:#fff}.pill.pronto{background:var(--c2);color:var(--ink)}
.meter{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px;position:relative}.meter span{display:block;height:100%;background:var(--c2)}
.meter span.low{background:var(--c1)}.meter i{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.5}
.panelgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.kpi b{display:block;font-size:28px;font-variant-numeric:tabular-nums}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:20px}
.buy{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.mat{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.mat .nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mat .nums input{text-align:right}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--mut);margin-top:8px}.facts b{color:var(--ink);font-variant-numeric:tabular-nums}
.gate{max-width:380px;margin:40px auto;text-align:center}
.foot{background:var(--c2);color:var(--ink);font-size:14px}.foot a{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--c1d);color:#fff;padding:12px 18px;border-radius:12px;z-index:60;display:none;max-width:90vw}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 14px}
@media(max-width:760px){.heroin{grid-template-columns:minmax(0,1fr)}.fig{min-height:250px}nav{order:3;width:100%;display:flex;overflow-x:auto}.mat{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:6.5em;margin-inline-start:-7em;color:var(--mut);font-size:13px}.stack td:empty{display:none}}
.prod .art{display:block;width:100%;height:250px;padding:0;border:0;cursor:pointer;background:var(--soft)}
.prod .art img{width:100%;height:100%;object-fit:cover;object-position:50% 14%;display:block}
.flyerimg{width:100%;border-radius:14px;margin-top:12px;border:1px solid var(--line)}
.qtyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.qtyrow input{width:110px;text-align:right}
details summary{cursor:pointer;min-height:32px;padding:4px 0}
.lamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px}
.lamgrid figure{margin:0;text-align:center}.lamgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:3px solid #fff;box-shadow:0 6px 16px rgba(122,42,79,.15)}
.lamgrid figcaption{font-weight:600;font-size:14px;margin-top:6px}
.holopick{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.hp{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);min-height:44px}
.hp img{width:56px;height:56px;border-radius:50%;object-fit:cover}
.hp[aria-pressed=true]{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 9%,var(--card))}
.hp:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
.ov{background:rgba(120,30,70,.45)}
.prod{box-shadow:0 8px 24px rgba(214,69,127,.08)}
.chip:hover{border-color:var(--c2)}
input,select,textarea{border-color:var(--line)}
.steps li.done::before{background:var(--c1);border-color:var(--c1)}
.invt td{vertical-align:middle}@media(max-width:600px){.invt td{padding-inline-start:10em}.invt td::before{width:9.5em;margin-inline-start:-10em}}.invt tr.st-ya{background:#ffe8f1}.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:600px){.acts{justify-content:flex-start}}
.heroimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:24px;box-shadow:0 14px 34px rgba(214,69,127,.18)}
.prod .art img.photo{object-position:50% 50%}
.imgrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.thumb{width:180px;height:110px;border-radius:14px;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;text-align:center;padding:4px}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px}.thumb.sm{width:64px;height:64px;padding:0}
.filebtn{display:inline-flex;align-items:center;cursor:pointer}
.pill.pay-pendiente{background:#fff;border:1px solid var(--c2)}.pill.pay-abono{background:var(--c2);color:var(--ink)}.pill.pay-pagado{background:var(--c1);color:#fff}
.paybox{margin:14px 0;padding:14px}
.bars{display:grid;gap:6px}.brow{display:grid;grid-template-columns:76px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:14px}
.bl{color:var(--mut)}.bt{height:14px;background:var(--soft);border-radius:99px;overflow:hidden}.bt i{display:block;height:100%;background:var(--c1);border-radius:99px;min-width:2px}.bv{text-align:right}
.kpi span.small{display:block}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>

function matStats(m){
 const since=Date.now()-30*DAY;
 const used=S.moves.filter(x=>x.m===m.id&&x.d<0&&x.t>=since&&x.r!=='Ajuste').reduce((s,x)=>s-x.d,0);
 const daily=used/30;let missing=0;
 S.orders.filter(active).forEach(o=>o.items.forEach(i=>i.use.forEach(u=>{if(u.m===m.id)missing+=u.need-u.got})));
 const days=daily>0?Math.floor(m.stock/daily):null;
 const state=(m.stock===0||missing>0)?'ya':(m.stock<=m.min||(days!=null&&days<=7))?'pronto':'bien';
 const sug=state==='bien'?0:Math.max(0,Math.ceil((m.min*2+missing-m.stock)/5)*5);
 return {used,missing,days,state,sug};
}
const STATE={ya:'Comprar ya',pronto:'Comprar pronto',bien:'Bien'};
function allocate(mid){const m=mat(mid);
 S.orders.filter(active).slice().reverse().forEach(o=>o.items.forEach(i=>i.use.forEach(u=>{if(u.m!==mid||u.got>=u.need||m.stock<=0)return;const take=Math.min(u.need-u.got,m.stock);u.got+=take;m.stock-=take;move(mid,-take,'Apartado para '+o.code)})));}

 const p=prod(pid);

 else{const v=p.variants[0];cfg={pid,vid:v.id,qty:v.unit?1:v.tiers[0][0],choices:Object.fromEntries((p.choices||[]).map(c=>[c.label,c.opts[0]])),extras:[],design:false,mode:'normal',notes:''}}
 if(!cfg.holo)cfg.holo=holos()[0]?.id;if(p.backs&&!cfg.back)cfg.back=p.backs[0].id;if(p.paperChoice&&!cfg.paper)cfg.paper=p.id==='agradecimiento'?'foto280':'opalina';cfg.flyer=false;renderCfg();

function designRow(p){

 return `<label class="toggle"><input type="checkbox" id="dz" ${cfg.design?'checked':''}><span><b>${lbl}</b><br><span class="muted small">Opcional. Si ya tienes tu arte listo para imprimir, no lo necesitas.</span></span></label>`;
}
function renderCfg(){
 const p=prod(cfg.pid);const v=variant(p,cfg.vid);
 const {units,lim}=avail(p,v,cfg.edit,cfg.holo,cfg.back,cfg.paper);
 const short=false; // la clienta siempre ve todo disponible; el faltante se controla en el panel
 const pq=!short?0:v.unit?units:Math.max(0,...v.tiers.map(x=>x[0]).filter(q=>q<=units&&q<cfg.qty));
 if(!short)cfg.mode='normal';else if(cfg.mode==='normal'||(cfg.mode==='parcial'&&pq<=0))cfg.mode='';
 const qtyFinal=cfg.mode==='parcial'?pq:cfg.qty;
 const ex=(p.extras||[]).filter(x=>cfg.extras.includes(x.id)).reduce((s,x)=>s+x.price,0);
 const dz=cfg.design&&typeof p.design==='number'?p.design:0;const bkp=((p.backs||[]).find(x=>x.id===cfg.back)||{}).price||0;
 const total=(qtyFinal>0?priceFor(v,qtyFinal):0)+ex+dz+bkp;
 let notice='';
 if(short)notice=`<div class="notice">${pq>0?`<strong>¡Podemos entregarte ${pq} ${esc(p.unit)} de inmediato!</strong><br>Para ${cfg.qty} ${esc(p.unit)}, el tiempo de producción es de máximo ${S.waitDays} días hábiles. ¿Qué prefieres?`:`<strong>Este acabado lo producimos especialmente para ti.</strong><br>El tiempo de producción es de máximo ${S.waitDays} días hábiles.`}${p.variants.length>1||p.backs||v.lams.includes('holo')?'<br><span class="small">También puedes escoger otro acabado y revisar su tiempo de entrega.</span>':''}

  ${pq>0?`<button class="chip" type="button" aria-pressed="${cfg.mode==='parcial'}" data-mode="parcial"><span>Me llevo ${pq} de entrega inmediata</span><span class="price">${fmt(priceFor(v,pq))}</span></button>`:''}</div></div>`;
 const qtyUI=v.unit?`<div class="qtyrow"><button class="btn alt sm" type="button" data-q="-1" aria-label="Menos">−</button><input id="qn" type="number" min="1" value="${cfg.qty}" inputmode="numeric" aria-label="Cantidad"><button class="btn alt sm" type="button" data-q="1" aria-label="Más">+</button><span class="muted small">${fmt(v.unit)} c/u</span></div>`
  :`<div class="chips">${v.tiers.map(([q,pr])=>`<button class="chip" type="button" data-qty="${q}" aria-pressed="${cfg.qty===q}">${q.toLocaleString('es-CO')} <span class="muted small price">${fmt(pr)}</span></button>`).join('')}</div>`;

  ${p.img?`<button class="btn alt sm" type="button" id="flyer" style="margin-top:10px">${cfg.flyer?'Ocultar ficha':'Ver ficha completa'}</button>`:''}
  ${cfg.flyer?`<img class="flyerimg" src="${esc(p.img)}.jpg" alt="Ficha de ${esc(p.name)}">`:''}
  ${p.variants.length>1?`<label>${esc(p.varLabel||'Opción')}</label><div class="chips">${p.variants.map(x=>`<button class="chip" type="button" data-v="${esc(x.id)}" aria-pressed="${x.id===v.id}">${x.lams.length&&p.varLabel==='Laminado'?swHtml(x.lams[0]==='holo'?holos()[0]:mat(x.lams[0])):''}${esc(x.name)}</button>`).join('')}</div>`:''}
  ${v.lams.includes('holo')?`<label>Diseño holográfico</label><div class="holopick">${holos().map(m=>`<button type="button" class="hp" data-holo="${esc(m.id)}" aria-pressed="${cfg.holo===m.id}"><img src="${esc(m.img)}" alt=""><span>${esc(m.short)}</span></button>`).join('')}</div>`:''}
  ${p.paperChoice?`<label>Papel</label><div class="chips">${PAPERS.map(id=>`<button class="chip" type="button" data-pp2="${id}" aria-pressed="${cfg.paper===id}">${esc(mat(id)?.short||id)}</button>`).join('')}</div>`:''}
  ${p.backs?`<label>${esc(p.backLabel||'Reverso')}</label><div class="chips">${p.backs.map(x=>`<button class="chip" type="button" data-bk="${esc(x.id)}" aria-pressed="${cfg.back===x.id}">${x.lam&&x.lam!=='same'?swHtml(mat(x.lam)):''}${esc(x.name)}${x.price?` <span class="muted small">+${fmt(x.price)}</span>`:''}</button>`).join('')}</div>`:''}
  <label>Cantidad${v.fixed?' (solo disponible en esta cantidad)':''}</label>${qtyUI}
  ${(p.choices||[]).map((c,ci)=>`<label>${esc(c.label)}</label><div class="chips">${c.opts.map(o=>`<button class="chip" type="button" data-ch="${ci}" data-o="${esc(o)}" aria-pressed="${cfg.choices[c.label]===o}">${esc(o)}</button>`).join('')}</div>`).join('')}

  ${notice}
  ${designRow(p)}
  ${p.note?`<p class="muted small">${esc(p.note)}</p>`:''}

  <div class="total"><span>Total</span><span class="price">${short&&!cfg.mode?'—':fmt(total)}</span></div>
  <button class="btn pri" type="button" id="addCart" style="width:100%" ${short&&!cfg.mode?'disabled':''}>${cfg.edit!=null?'Guardar cambios':'Agregar al carrito'}</button>
  ${short&&!cfg.mode?'<p class="muted small" style="text-align:center">Elige una de las opciones de arriba para continuar.</p>':''}`);
 cfg._total=total;cfg._qty=qtyFinal;
}
$('#dlg').addEventListener('click',e=>{
 const t=e.target.closest('button,input');if(!t||!cfg||!$('#addCart'))return;
 const keep=()=>{cfg.notes=$('#nt').value};
 const p=prod(cfg.pid);
 if(t.id==='flyer'){keep();cfg.flyer=!cfg.flyer;renderCfg()}
 else if(t.dataset.pp2){keep();cfg.paper=t.dataset.pp2;cfg.mode='normal';renderCfg()}
 else if(t.dataset.bk){keep();cfg.back=t.dataset.bk;cfg.mode='normal';renderCfg()}
 else if(t.dataset.holo){keep();cfg.holo=t.dataset.holo;cfg.mode='normal';renderCfg()}
 else if(t.dataset.v){keep();cfg.vid=t.dataset.v;const v=variant(p,cfg.vid);if(!v.unit&&!v.tiers.some(x=>x[0]===cfg.qty))cfg.qty=v.tiers[0][0];cfg.mode='normal';renderCfg()}
 else if(t.dataset.qty){keep();cfg.qty=+t.dataset.qty;cfg.mode='normal';renderCfg()}
 else if(t.dataset.q){keep();cfg.qty=Math.max(1,cfg.qty+ +t.dataset.q);cfg.mode='normal';renderCfg()}
 else if(t.dataset.ch!=null){keep();cfg.choices[p.choices[+t.dataset.ch].label]=t.dataset.o;renderCfg()}
 else if(t.dataset.ex){keep();cfg.extras=t.checked?[...cfg.extras,t.dataset.ex]:cfg.extras.filter(x=>x!==t.dataset.ex);renderCfg()}
 else if(t.dataset.mode){keep();cfg.mode=t.dataset.mode;renderCfg()}
 else if(t.id==='dz'){keep();cfg.design=t.checked;renderCfg()}
 else if(t.id==='addCart'){
  const v=variant(p,cfg.vid);const need=Math.ceil(cfg._qty/v.per);
  const hasHolo=v.lams.includes('holo');const use=Object.entries(needsOf(p,v,cfg.holo,cfg.back,cfg.paper)).map(([mid,k])=>({m:mid,need:need*k,got:Math.min(need*k,freeSheets(mid,cfg.edit))}));
  const bk=(p.backs||[]).find(x=>x.id===cfg.back);const req=Object.entries(needsOf(p,v,cfg.holo,cfg.back,cfg.paper,true)).map(([mid,k])=>({m:mid,need:need*k}));
  const exNames=(p.extras||[]).filter(x=>cfg.extras.includes(x.id)).map(x=>x.name);
  const item={pid:p.id,vid:v.id,paper:p.paperChoice?cfg.paper:'',paperName:p.paperChoice?mat(cfg.paper)?.short||'':'',back:cfg.back||'',backName:bk?(p.backLabel||'Reverso')+': '+bk.name:'',holo:hasHolo?cfg.holo:'',holoName:hasHolo?mat(cfg.holo).name:'',name:p.name,vname:p.variants.length>1?v.name:'',unit:p.unit,qty:cfg.qty,qtyFinal:cfg._qty,choices:{...cfg.choices},extras:[...cfg.extras],exNames,design:cfg.design,designTxt:cfg.design?(p.design==='cotiza'?'diseño (se cotiza)':'con diseño'):(p.design==='incl'?'diseño incluido':''),mode:'normal',notes:$('#nt').value.trim(),price:cfg._total,use,req,wait:false};
  const ed=cfg.edit;if(ed!=null)cart[ed]=item;else cart.push(item);
  saveCart();close();toast('Agregado al carrito');
 }
});

  code=data}else code='IP-'+(S.seq++);

function shrink(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.src=fr.result};fr.readAsDataURL(file)})}
async function toUrl(dataUrl,name){if(!LIVE)return dataUrl;const blob=await (await fetch(dataUrl)).blob();const path=name.replace(/[^\w-]/g,'')+'-'+Date.now()+'.jpg';
 const{error}=await sb.storage.from('fotos').upload(path,blob,{contentType:'image/jpeg',upsert:false});if(error)throw error;return sb.storage.from('fotos').getPublicUrl(path).data.publicUrl}

  if(k==='hero'){const old=S.page.hero;S.page.hero=url;if(!save()){S.page.hero=old;return}}else{const p=prod(k);const old=p.photo;p.photo=url;if(!save()){p.photo=old;return}}
  render();toast('Imagen guardada')}catch(err){toast('No se pudo leer esa imagen')}});

 if(t.id==='saveSched'){S.sched.pickup=$('#pk').value;S.sched.hours=$('#ph').value;S.sched.delivery=$('#dl').value;S.sched.national=$('#na').value;save();toast('Guardado')}
 if(t.id==='saveFee'){const o=S.orders.find(x=>x.code===openOrder);const v=$('#ofee').value;if(v===''){o.fee=0;o.feePending=true}else{o.fee=Math.max(0,+v);o.feePending=false}o.total=(o.sub??o.items.reduce((s,i)=>s+i.price,0))+o.fee;save();render();orderDlg(o.code);toast('Valor del envío guardado')}
 if(t.id==='saveSet'){S.wa=$('#sw2').value.replace(/\D/g,'');S.ig=$('#sig').value.replace(/^@/,'').trim();if(!LIVE){S.pin=$('#sp').value||'1234';}const nq=LIVE?0:parseInt($('#sq').value);const used=Math.max(0,...S.orders.map(o=>+o.code.slice(3)||0));if(nq>used)S.seq=nq;else if(nq)toast('Ese número ya se usó; debe ser mayor a '+used);save();render();if(!(nq&&nq<=used))toast('Ajustes guardados')}
 if(t.id==='copyList'){const txt='Lista de compras – Impresos y Publicidad\n'+S.mats.filter(m=>m.stock!=null).map(m=>({m,s:matStats(m)})).filter(x=>x.s.sug).map(x=>`• ${x.m.name}: ${x.s.sug} ${munit(x.m)}`).join('\n');
  try{navigator.clipboard.writeText(txt).then(()=>toast('Lista copiada'),()=>toast('No se pudo copiar'))}catch(err){toast('No se pudo copiar')}}
 if(t.id==='demo'){const p=prod('holografico');const v=p.variants[0];const code='IP-'+(S.seq++);const need=Math.ceil(200/v.per);
  const use=Object.entries(needsOf(p,v,'holo-corazon','mate','opalina')).map(([mid,k])=>{const m=mat(mid);const nd=need*k;const got=Math.min(nd,m.stock);m.stock-=got;move(mid,-got,'Pedido '+code);return {m:mid,need:nd,got}});
  const it={pid:p.id,vid:v.id,paper:'opalina',paperName:'Opalina 200 g',back:'mate',backName:'Reverso: mate',holo:'holo-corazon',holoName:'Holográfico corazón',name:p.name,vname:'',unit:p.unit,qty:200,qtyFinal:200,choices:{},extras:[],exNames:[],design:true,designTxt:'con diseño',mode:'espera',notes:'Logo al frente, redes atrás',price:166000+30000,use,wait:use.some(u=>u.got<u.need)};
  const z=S.sched.zones[0]||{name:'Medellín',price:null};S.orders.unshift({code,date:new Date().toISOString(),name:'Laura Gómez',wa:'3001234567',how:'domicilio',zone:z.name,fee:z.price||0,feePending:z.price==null,addr:'Cra 43A # 1-50, El Poblado',items:[it],sub:it.price,total:it.price+(z.price||0),status:'recibido',hist:[{s:'recibido',t:new Date().toISOString()}]});save();render();toast('Pedido de prueba creado')}
 if(t.id==='logout'){sb.auth.signOut().then(()=>location.reload())}
 if(t.id==='refreshOrders'){refreshOrders().then(()=>toast('Pedidos actualizados'))}
 if(t.id==='reset'){S=JSON.parse(JSON.stringify(DEF));save();render();toast('Datos iniciales restaurados')}
});
document.addEventListener('submit',e=>{
 const id=e.target.id;
 if(id==='gate'){e.preventDefault();if(LIVE){const btn=e.target.querySelector('button');btn.disabled=true;sb.auth.signInWithPassword({email:$('#gem').value.trim(),password:$('#pin').value}).then(async({error})=>{if(error){btn.disabled=false;toast('Correo o contraseña incorrectos');return}await enterAdmin()});return}
  if($('#pin').value===S.pin){admin=true;render()}else toast('Clave incorrecta')}
 if(id==='restock'){e.preventDefault();const m=mat(e.target.dataset.m);const q=Math.max(0,+$('#rq').value||0);if(!q)return;const paid=+$('#rc').value||0;
  m.stock+=q;move(m.id,q,'Compra'+(paid?' · '+fmt(paid):''));if(paid)S.moves[0].c=paid;if(paid)m.cost=Math.round(paid/q);allocate(m.id);save();close();render();toast('¡Inventario completado! '+m.name+': '+m.stock+' '+munit(m))}
 if(id==='adjust'){e.preventDefault();const m=mat(e.target.dataset.m);const v=Math.max(0,+$('#aq').value||0);move(m.id,v-m.stock,'Ajuste');m.stock=v;m.min=Math.max(0,+$('#am').value||0);m.cost=Math.max(0,+$('#ac').value||0);save();close();render();toast('Guardado')}
 if(id==='buyForm'){e.preventDefault();const m=mat($('#bm').value);const q=Math.max(0,+$('#bq').value||0);if(!q)return;const paid=+$('#bc').value||0;
  m.stock+=q;move(m.id,q,'Compra'+(paid?' · '+fmt(paid):''));if(paid)S.moves[0].c=paid;if(paid)m.cost=Math.round(paid/q);allocate(m.id);save();render();toast('Compra registrada')}
 if(id==='newMat'){e.preventDefault();const n=$('#nm').value.trim();if(!n)return;const [kind,sw]=$('#nk').value.split('|');const nid=n.toLowerCase().normalize('NFD').replace(/[^\w]+/g,'-')+'-'+Date.now().toString(36);
  S.mats.push({id:nid,name:n,short:n.replace(/^(laminado\s+)?holográfico\s*/i,'')||n,kind,stock:+$('#ns').value||0,min:+$('#nmin').value||0,cost:0,sw,...(sw==='holo'?{group:'holo'}:{})});save();render();toast('Material agregado')}
 if(id==='tf'){e.preventDefault();const c=$('#tc').value.trim().toUpperCase().replace(/^(\d)/,'IP-$1');const l4=$('#tp').value.trim();
  if(LIVE){sb.rpc('track_order',{p_code:c,p_last4:l4}).then(({data})=>{if(data)showTrack(data);else $('#tr').innerHTML='<div class="notice"><strong>No encontramos ese pedido.</strong> Revisa el número y los dígitos, o escríbenos por WhatsApp.</div>'});return}
  const o=S.orders.find(x=>x.code===c&&x.wa.slice(-4)===l4);
  if(o)showTrack(o);else $('#tr').innerHTML='<div class="notice"><strong>No encontramos ese pedido.</strong> Revisa el número y los dígitos, o escríbenos por WhatsApp.</div>'}
});
$('#cartBtn').addEventListener('click',openCart);

function render(){
 const h=location.hash.slice(1)||'catalogo';const view=h==='seguimiento'?'seguimiento':h==='panel'?'panel':'catalogo';
 $('#app').innerHTML=view==='seguimiento'?viewTrack():view==='panel'?viewPanel():viewCatalog();
 document.querySelectorAll('#nav a').forEach(a=>a.toggleAttribute('aria-current',a.getAttribute('href')==='#'+view));
 $('#foot').innerHTML=`<b>Impresos y Publicidad</b> · Medellín · Envíos a toda Colombia<br>WhatsApp <a href="${esc(waLink(S.wa,'¡Hola! Quiero información de impresos'))}" target="_blank" rel="noopener">${esc(S.wa.replace(/^57/,''))}</a> · Instagram <a href="https://instagram.com/${encodeURIComponent(S.ig)}" target="_blank" rel="noopener">@${esc(S.ig)}</a>`;
 if(h==='productos')document.getElementById('productos')?.scrollIntoView();
}
window.addEventListener('hashchange',()=>{close();render();if(location.hash!=='#productos')scrollTo(0,0)});
saveCart();render();
if(LIVE){loadPublic().then(()=>sb.auth.getSession()).then(({data})=>{if(data.session)enterAdmin()});setInterval(()=>{if(admin&&!document.hidden)refreshOrders()},60000)}
}
</script>
</body>
</html>
